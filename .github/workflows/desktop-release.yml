name: Desktop Release (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WorkTools Desktop ${{ github.ref_name }}'
          releaseBody: |
            ### WorkTools Desktop ${{ github.ref_name }} (Windows x64)

            - **Hardening Keamanan (`v1.1.1`):** Upgrade `pdfjs-dist` ke `6.5.438` (tutup CVE `GHSA-hq66-cqwq-w95j`) + loader terpusat `loadPdfDocumentSafe`, proteksi CRLF/Header Injection & allowlist port AI lokal pada Rust loopback bridge beserta *cleanup* child process saat exit, sandbox kanonik MCP/CLI + batas ukuran input, validasi impor `.pipeline.json` & Ghostscript WASM, serta header HSTS/CSP & GitHub Actions SHA pinning.
            - **AI Agent & Chat Studio:** Function calling lengkap (38 tool + `tenggoo_pipeline_run`), engine intent offline multi-langkah (`src/utils/aiIntentParser.ts`), log eksekusi per langkah, pratinjau teks/JSON inline, & *handoff* langsung ke Pipeline Studio.
            - **Visual Pipeline Studio:** AI Pipeline Builder (susun blok otomatis dari bahasa alami), 6 preset cepat, toggle *Aktif/Dilewati*, duplikat/reset langkah, deteksi kompatibilitas I/O, pratinjau multi-file, & ekspor CLI `--step`/`--steps` + MCP.
            - **100% Lokal di Perangkat:** 38 alat PDF, Gambar, & Utilitas tanpa unggah ke server, dilengkapi Rust loopback HTTP bridge & auto-starter untuk OpenCode / Ollama bebas CORS.
          releaseDraft: false
          prerelease: false

